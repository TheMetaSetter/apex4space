<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 340" role="img" aria-labelledby="schema-title schema-desc" style="display:block;width:100%;min-width:780px;height:auto;background:white">
<title id="schema-title">Two processed tables for the responder MVP</title>
<desc id="schema-desc">Daily hotspot summary stores counts and sorted unique cell IDs by release, area, and UTC day. Those IDs look up full shapes in hotspot cell using the release grid version. The dashed link is validated during preprocessing, not a SQL foreign key. No raw detections are stored locally.</desc>
<path d="M355 140 H485" fill="none" stroke="#4c6e9b" stroke-width="1.3" stroke-dasharray="6 4"/>
<text x="371" y="128" font-family="system-ui,sans-serif" font-size="12" fill="#4c6e9b">ID lookup</text>
<g font-family="system-ui,sans-serif"><rect x="25" y="30" width="330" height="184" fill="white" stroke="#b6b6b6"/><rect x="25" y="30" width="330" height="36" fill="#e8f2eb" stroke="#b6b6b6"/><text x="37" y="54" font-size="17" font-weight="600" fill="#19312e">hotspot_cell</text>
<text x="35" y="90" font-size="10" font-weight="700" fill="#8a6410">PK</text><text x="87" y="90" font-family="monospace" font-size="15" fill="#24362f">grid_version</text>
<text x="35" y="116" font-size="10" font-weight="700" fill="#8a6410">PK</text><text x="87" y="116" font-family="monospace" font-size="15" fill="#24362f">cell_id</text>
<text x="35" y="142" font-size="10" font-weight="700" fill="#8a6410"></text><text x="87" y="142" font-family="monospace" font-size="15" fill="#24362f">center_longitude</text>
<text x="35" y="168" font-size="10" font-weight="700" fill="#8a6410"></text><text x="87" y="168" font-family="monospace" font-size="15" fill="#24362f">center_latitude</text>
<text x="35" y="194" font-size="10" font-weight="700" fill="#8a6410"></text><text x="87" y="194" font-family="monospace" font-size="15" fill="#24362f">geometry</text>
</g>
<g font-family="system-ui,sans-serif"><rect x="485" y="30" width="330" height="210" fill="white" stroke="#b6b6b6"/><rect x="485" y="30" width="330" height="36" fill="#e8f2eb" stroke="#b6b6b6"/><text x="497" y="54" font-size="17" font-weight="600" fill="#19312e">daily_hotspot_summary</text>
<text x="495" y="90" font-size="10" font-weight="700" fill="#8a6410">PK</text><text x="547" y="90" font-family="monospace" font-size="15" fill="#24362f">release_id</text>
<text x="495" y="116" font-size="10" font-weight="700" fill="#8a6410">PK</text><text x="547" y="116" font-family="monospace" font-size="15" fill="#24362f">area_id</text>
<text x="495" y="142" font-size="10" font-weight="700" fill="#8a6410">PK</text><text x="547" y="142" font-family="monospace" font-size="15" fill="#24362f">date</text>
<text x="495" y="168" font-size="10" font-weight="700" fill="#8a6410"></text><text x="547" y="168" font-family="monospace" font-size="15" fill="#24362f">active_cell_count</text>
<text x="495" y="194" font-size="10" font-weight="700" fill="#8a6410"></text><text x="547" y="194" font-family="monospace" font-size="15" fill="#24362f">hotspot_cell_ids (JSON)</text>
<text x="495" y="220" font-size="10" font-weight="700" fill="#8a6410"></text><text x="547" y="220" font-family="monospace" font-size="15" fill="#24362f">status</text>
</g>
<text x="25" y="294" font-family="system-ui,sans-serif" font-size="14" fill="#546762">Local tables contain processed cells and summaries only.</text><text x="25" y="320" font-family="system-ui,sans-serif" font-size="14" fill="#546762">Source/version/hash and grid settings stay in small release metadata files.</text></svg>