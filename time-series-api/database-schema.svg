<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 450" role="img" aria-labelledby="title desc">
<title id="title">Schema 2 all-date hotspot database</title>
<desc id="desc">Three processed tables link daily counts to cell/day memberships and cell shapes. No raw FIRMS rows are stored.</desc>
<rect width="900" height="450" fill="#f0f3ec"/>
<g font-family="system-ui,sans-serif" fill="#19312e">
<text x="30" y="42" font-size="24" font-weight="700">All-date FIRMS database · schema 2</text>
<text x="30" y="68" font-size="14">Processed cell shapes and dates only · coverage unknown</text>
<g transform="translate(30 110)"><rect width="250" height="265" rx="12" fill="#fffef9" stroke="#17634e" stroke-width="2"/><path d="M0 48h250" stroke="#17634e" stroke-width="2"/><text x="16" y="31" font-size="18" font-weight="700">hotspot_cell</text><text x="16" y="82" font-size="14" font-weight="700">PK grid_version</text><text x="16" y="110" font-size="14" font-weight="700">PK cell_id</text><text x="16" y="150" font-size="13">column_index · row_index</text><text x="16" y="178" font-size="13">projected cell bounds</text><text x="16" y="206" font-size="13">WGS84 center</text><text x="16" y="234" font-size="13">full GeoJSON geometry</text></g>
<g transform="translate(325 110)"><rect width="250" height="265" rx="12" fill="#fffef9" stroke="#17634e" stroke-width="2"/><path d="M0 48h250" stroke="#17634e" stroke-width="2"/><text x="16" y="31" font-size="18" font-weight="700">hotspot_cell_day</text><text x="16" y="82" font-size="13" font-weight="700">PK release_id · date</text><text x="16" y="110" font-size="13" font-weight="700">PK grid_version · cell_id</text><text x="16" y="154" font-size="13">one active membership</text><text x="16" y="182" font-size="13">per cell and UTC day</text><text x="16" y="226" font-size="12">FK to daily summary and cell</text></g>
<g transform="translate(620 110)"><rect width="250" height="265" rx="12" fill="#fffef9" stroke="#17634e" stroke-width="2"/><path d="M0 48h250" stroke="#17634e" stroke-width="2"/><text x="16" y="31" font-size="18" font-weight="700">daily_hotspot_summary</text><text x="16" y="82" font-size="14" font-weight="700">PK release_id · date</text><text x="16" y="126" font-size="13">area_id = world</text><text x="16" y="154" font-size="13">active_cell_count</text><text x="16" y="182" font-size="13">coverage_unknown status</text><text x="16" y="210" font-size="13">records_present / no_records</text></g>
<path d="M325 244H280M575 244H620" stroke="#4c6e9b" stroke-width="2"/><text x="30" y="420" font-size="14">Area totals are computed from cell centers and dated memberships; raw detections are not stored.</text>
</g></svg>
